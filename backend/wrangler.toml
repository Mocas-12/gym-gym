name = "gymgym-backend"
main = "worker.js"
compatibility_date = "2026-01-01"

# 允许的前端来源（逗号分隔）。改了要重新 deploy。
[vars]
ORIGINS = "https://mocas-12.github.io,http://localhost:5173,http://localhost:4173"
VAPID_SUB = "https://mocas-12.github.io/gym-gym/"

# KV 存储：已创建（2026-10-12）
[[kv_namespaces]]
binding = "KV"
id = "5f30a96dc60740ed9a155b993744145a"

[[durable_objects.bindings]]
name = "USERS"
class_name = "GymUser"

[[migrations]]
tag = "v1-users"
new_sqlite_classes = ["GymUser"]
